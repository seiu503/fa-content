			let node;
			while ((node = walker.nextNode())) {
				let text = node.nodeValue;
				validationMessages.forEach(message => {
					Object.values(message).forEach(source => {
						if (source !== message[getLang]) text = text.replaceAll(source, message[getLang]);
					});
				});
				if (text !== node.nodeValue) node.nodeValue = text;
			}
		});
	}
	const errorObserver = new MutationObserver(translateValidationMessages);
	errorObserver.observe(formEl, { childList: true, subtree: true, characterData: true });
	formEl.addEventListener("submit", function() {
		setTimeout(translateValidationMessages, 0);
	});
	translateValidationMessages();
});
</script>







<script type="text/javascript">
window.addEventListener("load", function () {
  const dobEl = document.getElementById("tfa_113");
  const mmSelect = document.getElementById("tfa_156");
  const ddSelect = document.getElementById("tfa_157");
  const yyyySelect = document.getElementById("tfa_158");

  if (!dobEl || !mmSelect || !ddSelect || !yyyySelect) return;

  // FormAssembly option values may be IDs, so read the displayed text.
  function getSelectedText(selectEl) {
    const option = selectEl.options[selectEl.selectedIndex];
    return option && option.value !== ""
      ? option.textContent.trim()
      : "";
  }

  function setSelectByText(selectEl, text) {
    const option = Array.from(selectEl.options).find(
      opt => opt.textContent.trim() === text || opt.value === text
    );

    if (option) {
      selectEl.value = option.value;
      option.selected = true;
    }
  }

  // Preserve the translated placeholder and restore the previous selection.
  function populateSelect(selectEl, items, previousText) {
    const placeholder = selectEl.options[0]?.textContent || "";
    selectEl.options.length = 0;
    selectEl.add(new Option(placeholder, ""));

    items.forEach(item => selectEl.add(new Option(item, item)));

    if (previousText) {
      setSelectByText(selectEl, previousText);
    }
  }

  function refreshDayOptions() {
    const previousDay = getSelectedText(ddSelect);
    const month = getSelectedText(mmSelect);
    const maxDay = month === "02"
      ? 29
      : ["04", "06", "09", "11"].includes(month) ? 30 : 31;

    const days = Array.from(
      { length: maxDay },
      (_, i) => String(i + 1).padStart(2, "0")
    );

    populateSelect(ddSelect, days, previousDay);
  }

  function restoreVisibleFieldsFromDob() {
    const match = (dobEl.value || "").match(
      /^(\d{4})-(\d{2})-(\d{2})$/
    );
    if (!match) return;

    const [, yyyy, mm, dd] = match;
    setSelectByText(mmSelect, mm);
    refreshDayOptions();
    setSelectByText(ddSelect, dd);
    setSelectByText(yyyySelect, yyyy);
  }

  function updateBirthdateField() {
    const mm = getSelectedText(mmSelect);
    const dd = getSelectedText(ddSelect);
    const yyyy = getSelectedText(yyyySelect);

    // Avoid creating an invalid date from incomplete selections.
    dobEl.value = mm && dd && yyyy ? `${yyyy}-${mm}-${dd}` : "";

    dobEl.dispatchEvent(new Event("input", { bubbles: true }));
    dobEl.dispatchEvent(new Event("change", { bubbles: true }));
  }

  const currentYear = new Date().getFullYear();
  const years = Array.from(
    { length: 100 },
    (_, i) => String(currentYear - i)
  );

  populateSelect(yyyySelect, years, getSelectedText(yyyySelect));
  refreshDayOptions();
  restoreVisibleFieldsFromDob();

  mmSelect.addEventListener("change", function () {
    refreshDayOptions();
    updateBirthdateField();
  });
  ddSelect.addEventListener("change", updateBirthdateField);
  yyyySelect.addEventListener("change", updateBirthdateField);
});
</script>
